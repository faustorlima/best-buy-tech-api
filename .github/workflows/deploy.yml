name: Build and Deploy API to DigitalOcean

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/best-buy-tech-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da Imagem Docker da API
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy no Droplet via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            # Autentica no GHCR no servidor
            echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Baixa a nova imagem da API
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            # Remove o container antigo da API se existir
            docker stop api_prod || true
            docker rm api_prod || true

            # Sobe o novo container da API (expondo na porta 5000 do servidor)
            docker run -d \
              --name api_prod \
              -p 5000:5000 \
              --restart unless-stopped \
              -e PORT=5000 \
              ghcr.io/${{ env.IMAGE_NAME }}:latest

            # Limpa imagens órfãs
            docker image prune -f
